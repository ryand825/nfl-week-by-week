
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<title>NFL Week by Week</title>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky scoreboard header with week strip, game cards grouped by day, detail sheet on click */
:root{
  --bg:#eef0ee; --surface:#fbfbfa; --surface2:#e4e8e5; --line:#cfd5d1;
  --fg:#16211b; --muted:#5a6860; --accent:#f2c230; --accent-fg:#1b1600; --accent-text:#8a6a00;
  --live:#c8341f; --good:#1e7a46;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1310; --surface:#151d19; --surface2:#1d2822; --line:#2a3731;
  --fg:#e8efe9; --muted:#93a39a; --accent:#f2c230; --accent-fg:#1b1600; --accent-text:#f2c230;
  --live:#ff6a52; --good:#4cc582; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#151d19; --surface2:#1d2822; --line:#2a3731;
  --fg:#e8efe9; --muted:#93a39a; --accent:#f2c230; --accent-fg:#1b1600; --accent-text:#f2c230;
  --live:#ff6a52; --good:#4cc582; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px 8px;flex-wrap:wrap}
.brand{font:800 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
.brand small{font:500 12px var(--mono);letter-spacing:.08em;color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0003}
.weeks{display:flex;align-items:center;gap:6px;padding-bottom:10px}
.strip{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.strip::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:40px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px 6px;text-align:center;font:500 13px var(--mono);position:relative}
.wk[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wk i{display:block;height:3px;border-radius:2px;margin-top:4px;background:var(--line)}
.wk.done i{background:var(--good)} .wk.live i{background:var(--live)} .wk[aria-current="true"] i{background:var(--accent-fg);opacity:.5}
.wk.cur i,.wk.cur[aria-current="true"] i{background:var(--live);opacity:1}
.nav{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:18px;line-height:1}
.nav:disabled{opacity:.35;cursor:default}
main{padding-block:20px 40px}
.wkhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h2{font:800 40px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.bye{color:var(--muted);font:400 12px var(--mono)}
.dtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:14px 0 0;border-bottom:1px solid var(--line)}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:0 0 auto;border:0;background:none;padding:10px 14px;font:600 15px var(--body);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.full{max-width:none;padding-inline:0}
.full .wkhead,.full .empty{padding-inline:16px}
.full .grid{border-radius:0;border-inline:0}
@media (min-width:1300px){.full .grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);overflow:hidden;border:1px solid var(--line);border-radius:10px;margin-top:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border:0;border-radius:0;padding:12px 14px 14px;min-width:0;width:100%;box-shadow:inset -1px -1px 0 var(--line)}
.card:hover{background:var(--surface2)}
.card:focus-visible{outline-offset:-2px}
.ctop{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--mono);color:var(--muted);min-height:16px}
.ctop .st{color:var(--fg)}
.ctop .st.live{color:var(--live)}
.ctop .tv{font:600 12px var(--body);color:var(--fg);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow{display:flex;align-items:center;gap:7px;min-width:0}
.slot{font:800 13px var(--body);letter-spacing:.06em;color:var(--accent-text)}
.back{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:6px;height:34px;padding:0 12px;font-weight:600;margin:12px 16px 0}
.th{display:flex;align-items:center;gap:14px;padding:14px 16px 4px}
.th .logo{width:56px;height:56px}
.th h2{font-size:34px}
.tsum{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font:400 12px var(--mono);margin-top:6px}
.tsum b{color:var(--fg);font-weight:500}
.sched{margin-top:12px;border-top:1px solid var(--line);background:var(--surface)}
.sg{display:grid;grid-template-columns:24px 84px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 16px;min-height:56px}
button.sg{cursor:pointer}
button.sg:hover{background:var(--surface2)}
.wn{font:500 12px var(--mono);color:var(--muted)}
.sd{font:500 12px/1.35 var(--mono)}
.so{display:flex;align-items:center;gap:8px;min-width:0}
.so b{font:800 20px/1 var(--display);letter-spacing:.03em}
.so .at{font:500 12px var(--mono);color:var(--muted);width:2ch;text-align:left}
.on{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr small{display:block;color:var(--muted);font-size:11px}
.sr .live,.sr small.live{color:var(--live)}
.sg.bye{color:var(--muted);min-height:44px}
.sg.bye .so b{font-size:15px;letter-spacing:.12em}
@media (max-width:520px){.on{display:none}.sg{grid-template-columns:20px 76px minmax(0,1fr) auto;padding-inline:12px}}
.tl{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;font:inherit;font-weight:500;padding:0;text-align:left;cursor:pointer}
.tl:hover span:last-child{text-decoration:underline}
button.side{border:0;background:none;color:inherit;font:inherit;padding:6px;border-radius:8px;cursor:pointer}
button.side:hover b{text-decoration:underline}
.side .go{color:var(--accent-text);font-family:var(--body)}
@media (max-width:720px){.fullm{padding-inline:0}.fullm .wkhead,.fullm .conf h3{padding-inline:16px}.fullm .tw{border-radius:0;border-inline:0}}
.injgrid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:640px){.injgrid{grid-template-columns:1fr 1fr}}
.injteam{min-width:0}
.injh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.injh .logo{width:26px;height:26px}
.inj{list-style:none;margin:0;padding:0}
.inj li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.inj .in{min-width:0;display:flex;flex-direction:column}
.inj .in small{color:var(--muted);font:400 12px var(--mono)}
.inj .nm small{display:inline}
.inj .isub{margin-top:1px}
.ist{flex:0 0 auto;min-width:50px;text-align:center;font:600 11px var(--mono);letter-spacing:.04em;padding:3px 0;border:1px solid var(--line);border-radius:4px;margin-top:1px}
.s-out{color:var(--live);border-color:var(--live)}
.s-d{color:var(--accent-text);border-color:var(--accent-text)}
.s-q{color:var(--muted)}
.s-ir{color:var(--muted);border-style:dashed}
.none{color:var(--muted);font-size:13px;margin:6px 0}
.ir{margin-top:10px}
.ir summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
.ret{font:500 12px var(--mono);color:var(--muted);margin-top:2px}
.ret.end{color:var(--live);font-weight:600}
.nt{margin-top:5px}
.nt summary{cursor:pointer;color:var(--muted);font-size:12.5px;line-height:1.4}
.nt p{margin:6px 0 2px;font-size:13px;line-height:1.45}
.nt1{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.logo{flex:0 0 auto;display:inline-block;width:26px;height:26px;border-radius:50%}
.logo picture,.logo img{display:block;width:100%;height:100%;object-fit:contain}
.logo.nologo{background:var(--c)}.logo.nologo picture{display:none}
td .logo{width:28px;height:28px}
.side .logo{width:64px;height:64px}
.ab{font:800 20px/1 var(--display);letter-spacing:.03em}
.rec{font:400 12px var(--mono);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odd{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.score{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.trow.lose .ab,.trow.lose .score{color:var(--muted)}
.fb{flex:0 0 auto;width:20px;height:12px}
.fb-b{fill:#7a4420;stroke:#3d1f0c;stroke-width:.6}
.fb-l{fill:none;stroke:#fff;stroke-width:1;stroke-linecap:round}
.sit{font:500 12px var(--mono);color:var(--muted)}
.sit.rz{color:var(--live)}
.trow.win .score::before{content:"◂";font-size:12px;color:var(--accent-text);margin-right:5px;vertical-align:middle}
.empty{color:var(--muted);padding:24px 0}
/* standings */
.conf{margin-top:20px}
.conf h3{font:800 28px/1 var(--display);letter-spacing:.04em;margin:0 0 8px}
.gsel{margin-left:auto}
.gsel button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0003}
.divgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:4px 16px;align-items:start;margin-bottom:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:first-child{display:flex;align-items:center;gap:10px;font-weight:500}
tbody tr+tr td{border-top:1px solid var(--line)}
td.n{font-family:var(--mono);font-size:13px}
.pos{color:var(--good)} .neg{color:var(--live)}
.rank{font:500 12px var(--mono);color:var(--muted);width:1.5ch;text-align:right}
/* detail sheet */
.ov{position:fixed;inset:0;z-index:20;background:#000a;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px 24px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:760px;padding:16px 16px 24px;margin-block:auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 12px var(--mono);color:var(--muted)}
.x{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:6px;font-size:18px;line-height:1}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:14px 0 6px}
.side{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}

.side b{font-weight:600}
.side small{font:400 12px var(--mono);color:var(--muted)}
.big{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.big span.dash{color:var(--muted);font-size:36px}
.big .l{color:var(--muted)}
.ls{margin:12px 0 0;overflow-x:auto}
.ls table{font-size:13px}
.sec{margin-top:22px}
.sec h4{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:12px;align-items:center}
.drive .dh{display:flex;align-items:center;gap:10px;margin-top:14px}
.drive .dh .logo{width:32px;height:32px}
.drive .dh b{display:block;font:800 18px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.drive .dh small{font:400 12px var(--mono);color:var(--muted)}
.dd{display:grid;grid-template-columns:1fr 1fr;margin:0 auto;max-width:280px;text-align:center}
.dd div+div{border-left:1px solid var(--line)}
.dd small{display:block;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dd b{font:800 22px/1.2 var(--display);letter-spacing:.03em}
.fld{position:relative;padding-top:44px;margin:4px 0 0}
.turf{position:relative;height:64px;border-radius:4px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--surface2) 0 8.333%,var(--surface) 8.333% 16.667%);border:1px solid var(--line)}
.ez{position:absolute;top:0;bottom:0;width:8.333%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ez.l{left:0}.ez.r{right:0}
.ez span{font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transform:rotate(-90deg)}
.ez.r span{transform:rotate(90deg)}
.turf .yl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.turf .yl.mid{background:var(--muted);opacity:.6}
.turf .drv{position:absolute;top:0;bottom:0;opacity:.28}
.turf .los{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#2f6fe0}
.turf .fdl{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#f2c230}
.pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:1}
.pin .logo{width:34px;height:34px;background:var(--surface);border:2px solid var(--fg);padding:3px}
.pin::after{content:"";width:2px;height:8px;background:var(--fg)}
.ynum{position:relative;height:18px;font:500 11px var(--mono);color:var(--muted)}
.ynum span{position:absolute;top:3px;transform:translateX(-50%)}
.lplay{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.lph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lph>b{font-weight:600;margin-right:auto}
.lph .wp{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.lph .wp .logo{width:20px;height:20px}
.lph .wp b{color:var(--fg);font:500 13px var(--mono)}
.lph .tag{font:600 12px var(--body);background:var(--surface2);border-radius:4px;padding:2px 7px}
.lplay p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.lplay .lpf{font:400 12px var(--mono);margin-top:10px}
.dplays{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.dplays li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:9px 0}
.dplays li+li{border-top:1px solid var(--line)}
.lplay .dplays p{margin:0;color:var(--fg)}
.lplay .dplays .pm{font:400 12px var(--mono);color:var(--muted);margin-bottom:2px}
.dplays .py{font:500 13px var(--mono);white-space:nowrap;padding-top:16px}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:12px}
.pc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.ph{display:flex;align-items:center;gap:10px}
.ph .hs{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;background:var(--surface2);flex:0 0 auto}
.ph b{display:block;font-weight:600}
.ph small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.ph small .logo{width:16px;height:16px}
.ps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);text-align:center}
.ps div+div{border-left:1px solid var(--line)}
.ps small{display:block;font:500 10px var(--mono);letter-spacing:.06em;color:var(--muted)}
.ps b{font:500 15px var(--mono)}
.sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .v{font:500 13px var(--mono)}
.cmp .v:last-child{text-align:right}
.cmp .lab{text-align:center;font-size:13px;color:var(--muted)}
.bars{grid-column:1/-1;display:flex;height:5px;gap:2px;margin-bottom:6px}
.bars i{display:block;height:100%;border-radius:2px}
.plays{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plays li{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:start;font-size:14px}
.plays .q{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.plays .sc{font:500 13px var(--mono);white-space:nowrap}
.tsel{display:flex;gap:4px;margin-bottom:10px}
.tsel button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 12px;font-weight:600;font-size:13px}
.tsel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pcat{margin-bottom:12px}
.pcat .tw{border-radius:8px}
.pcat .cn{font:600 12px var(--mono);color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.pre dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.pre dt{color:var(--muted)} .pre dd{margin:0}
footer{padding-block:0 32px;color:var(--muted);font:400 12px var(--mono)}
@media (max-width:520px){h2{font-size:34px}.big{font-size:48px}.brand small{display:none}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand">NFL <span id="season">2026</span><small>REGULAR SEASON</small></div>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-scores" aria-selected="true">Scores</button>
      <button role="tab" id="tab-stand" aria-selected="false">Standings</button>
    </div>
  </div>
  <div class="weeks" id="weeks">
    <button class="nav" id="prev" aria-label="Previous week">‹</button>
    <div class="strip" id="strip" role="tablist" aria-label="Week"></div>
    <button class="nav" id="next" aria-label="Next week">›</button>
  </div>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>

/* live polling: every 30s while a game is on or about to start, plus an open box score */
const prevSt={};
function needsPoll(){const now=Date.now();return W[wk].some(g=>g.state==='in'||(g.state==='pre'&&new Date(g.date).getTime()-now<20*60000))}
async function tick(){
  if(document.hidden)return;
  if(needsPoll())await refreshLive();
  if($('#ov')&&openId){
    const g=allGames().find(x=>x.id===openId);
    if(g&&(g.state==='in'||prevSt[openId]==='in')){const ok=await fetchBox(openId);if(ok&&$('#ov'))openGame(openId,null,true)}
    if(g)prevSt[openId]=g.state;
  }
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshLive();if(view==='stand')refreshStand()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body></html>
